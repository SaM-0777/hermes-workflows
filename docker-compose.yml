# Long-lived node execution container for Workflow Studio.
#
#   docker compose up -d            # create + start (builds on first run)
#   docker compose logs -f          # inspect
#   docker compose down             # stop + remove the container (volumes survive)
#   docker compose down -v          # ⚠ also deletes volumes: interpreter + packages
#
# Durability, deliberately stacked:
#   restart: unless-stopped  → the container comes back when Docker starts.
#   pyenv:/opt/venv          → the interpreter and every `uv pip install` live on
#                              a named volume, so recreating the container or
#                              rebuilding the image keeps them.
#   node-work:/work          → node scripts and artifacts persist too.
#   uv-cache:/opt/uv-cache   → wheel/build cache persists, installs stay fast.
#
# The plugin never builds or recreates this container: it checks the container,
# starts it with `docker start` if it is stopped, and runs node code with
# `docker exec`. Everything about the environment lives in this file and the
# Dockerfile beside it.
name: hermes-workflow

services:
  nodes:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-workflow:latest
    container_name: hermes-workflow
    init: true
    restart: unless-stopped
    command: ["sleep", "infinity"]
    working_dir: /work
    labels:
      # The plugin finds this container by label when no name is configured.
      hermes.workflow.node: "1"
    environment:
      PYTHONUNBUFFERED: "1"
      UV_CACHE_DIR: /opt/uv-cache
      VIRTUAL_ENV: /opt/venv
      PATH: /opt/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # The interpreter environment: /opt/venv is created on first start and
      # reused forever. Packages installed with `uv pip install` land here.
      - pyenv:/opt/venv
      # Node scripts and artifacts; shared by every node.
      - node-work:/work
      # uv's wheel/build cache.
      - uv-cache:/opt/uv-cache
      # Read-only view of the plugin's stored workflows/nodes.
      - ${HERMES_WORKFLOW_DATA:-~/.hermes/plugin-data/hermes-workflow}:/data:ro
      # The host home directory at the same absolute path, so the paths the
      # studio stores for image/video parameters (and the paths nodes return)
      # resolve identically inside the container. Writable because annotated
      # results have to be readable by the studio on the host again.
      - ${HOME:-/Users/sam}:${HOME:-/Users/sam}:rw
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s

volumes:
  pyenv:
  node-work:
  uv-cache:
