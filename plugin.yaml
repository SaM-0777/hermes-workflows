name: hermes-workflow
label: Hermes Workflow
version: 0.0.1
author: SaM-0777
homepage: https://github.com/SaM-0777/hermes-workflows/tree/main
description: Visual workflow studio for designing, running, and iterating on multi-step agent and automation flows inside Hermes Desktop.
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  # Node Library tools
  - list_nodes
  - get_node_by_id
  - create_node
  - update_node
  - delete_node
  # Workflow tools
  - list_workflows
  - get_workflow_by_id
  - create_workflow
  - update_workflow
  - delete_workflow
  #
  - add_node_to_workflow
  - add_library_node_to_workflow
  - update_workflow_node
  - delete_workflow_node
  - duplicate_workflow_node
  - add_workflow_edge
  - remove_workflow_edge

